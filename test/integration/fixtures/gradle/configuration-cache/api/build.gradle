plugins {
    id 'java'
    id 'com.diffplug.spotless'
}

repositories {
    mavenCentral()
}

spotless {
    java {
        googleJavaFormat('1.36.1')
    }
}

def generate = tasks.register('generate') {
    for (int i = 0; i < 300; i++) {
        doLast {
            System.out.println('Generating')
            Thread.sleep(2)
        }
    }
}

tasks.named('spotlessJava') {
    dependsOn generate
}
