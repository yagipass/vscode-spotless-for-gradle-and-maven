name: gradle-for-java

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  integration:
    name: integration (Gradle for Java ${{ matrix.channel }})
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, pre-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: |
          version=$(node scripts/newest-gradle-for-java.mjs "$CHANNEL")
          echo "Gradle for Java $version"
          echo "SPOTLESS_FOR_GRADLE_AND_MAVEN_TEST_GRADLE_FOR_JAVA=$version" >> "$GITHUB_ENV"
        env:
          CHANNEL: ${{ matrix.channel }}
      - run: xvfb-run -a pnpm test:integration --label gradle
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-logs-gradle-for-java-${{ matrix.channel }}
          path: .cache/logs
          include-hidden-files: true
