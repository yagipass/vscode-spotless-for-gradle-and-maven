name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm sync:runtime-types
      - run: pnpm test:unit

  integration:
    name: integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'bash' || 'nix develop --command bash -e {0}' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os != 'Windows'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - if: runner.os != 'Windows'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
      - if: runner.os == 'Windows'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: runner.os == 'Windows'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: runner.os == 'Windows'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          MVND_VERSION: 1.0.6
          MVND_SHA512: 4dd97b1f26525055cec960fb5b953b70d1e6606f96f5b096efa932754fd3e9d0238e00ca97779368f29cb751f1776445c45da618ea8d0d84692c3b936087309f
        run: |
          $name = "maven-mvnd-$env:MVND_VERSION-windows-amd64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/apache/maven-mvnd/releases/download/$env:MVND_VERSION/$name.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA512).Hash -ne $env:MVND_SHA512) { throw "$zip does not match its SHA-512" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP $name bin | Add-Content $env:GITHUB_PATH
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          pnpm build
          mkdir -p .cache/diag
          cat > .cache/diag/maven.cjs <<'JS'
          const { spawnSync } = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.cwd();
          const meta = /([()\][%!^"`<>&|;, *?])/g;
          const escape = (t) => t.replace(meta, "^$1");
          const quote = (a) => `"${a.replace(/(\\*)"/g, '$1$1\\"').replace(/(\\*)$/, "$1$1")}"`;
          const line = (exe, args) => [escape(exe), ...args.map((a) => escape(quote(a)))].join(" ");
          const special = path.join(root, ".cache", "日本語 & 100% ^");
          fs.rmSync(special, { recursive: true, force: true });
          fs.cpSync(path.join(root, "test", "integration", "fixtures"), path.join(special, "fixtures"), { recursive: true });
          const env = { ...process.env, MAVEN_USER_HOME: path.join(root, ".cache", "maven-user-home") };
          console.log(spawnSync("java", ["-XshowSettings:properties", "-version"], { encoding: "utf8" }).stderr.split("\n").filter((l) => /encoding|user.dir/.test(l)).join("\n"));
          for (const [name, base] of [["plain", path.join(root, "test", "integration", "fixtures")], ["special", path.join(special, "fixtures")]]) {
            const project = path.join(base, "maven", "single");
            const file = path.join(project, "src", "main", "java", "com", "example", "Sample.java");
            const hook = path.join(base, "..", `hook-${name}`);
            fs.mkdirSync(hook, { recursive: true });
            fs.writeFileSync(path.join(hook, "stdin"), "package com.example;\npublic class Sample {\nint  x;\n}\n");
            fs.writeFileSync(path.join(hook, "stdout"), "");
            fs.writeFileSync(path.join(hook, "stderr"), "");
            const log = path.join(root, ".cache", "diag", `${name}.log`);
            const args = ["-X", "-B", "-l", log, "-f", "pom.xml", "-N",
              "--define", `maven.ext.class.path=${path.join(root, "dist", "spotless-for-gradle-and-maven-extension.jar")}`,
              "--define", `spotlessForGradleAndMaven.stdin=${path.join(hook, "stdin")}`,
              "--define", `spotlessForGradleAndMaven.stdout=${path.join(hook, "stdout")}`,
              "--define", `spotlessForGradleAndMaven.stderr=${path.join(hook, "stderr")}`,
              "--define", `spotlessIdeHook=${file.replace(/^D:/, "d:")}`,
              "--define", "spotlessIdeHookUseStdIn", "--define", "spotlessIdeHookUseStdOut",
              "com.diffplug.spotless:spotless-maven-plugin:apply"];
            const r = spawnSync(process.env.ComSpec, ["/d", "/s", "/c", `"${line(path.join(project, "mvnw.cmd"), args)}"`], { cwd: project, env, windowsVerbatimArguments: true, encoding: "utf8" });
            console.log(`== ${name} status=${r.status} stdout=${r.stdout.slice(-800)} stderr=${r.stderr.slice(-800)}`);
            console.log("hook stderr:", JSON.stringify(fs.readFileSync(path.join(hook, "stderr"), "utf8")));
            const text = fs.existsSync(log) ? fs.readFileSync(log, "utf8") : "(no log)";
            console.log(text.split("\n").filter((l) => /spotlessIdeHook|user\.dir|multiModuleProjectDirectory|maven\.repo\.local|spotlessForGradleAndMaven|Command line|ERROR|baseDir|basedir =/.test(l)).slice(0, 40).join("\n"));
          }
          JS
          node .cache/diag/maven.cjs
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pnpm test:integration
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs-${{ runner.os }}
          path: .cache/logs
          include-hidden-files: true
