name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
      - run: nix flake check -L
        shell: bash
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm sync:runtime-types
      - run: pnpm test:unit

  integration:
    name: integration (${{ matrix.profile == 'latest' && matrix.os || format('{0}, {1}', matrix.os, matrix.profile) }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [latest]
        include:
          - os: ubuntu-latest
            profile: oldest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'bash' || 'nix develop --command bash -e {0}' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - if: runner.os != 'Windows'
        uses: cachix/install-nix-action@v31.11.1
      - if: runner.os != 'Windows'
        uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
      - if: runner.os == 'Windows'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - if: runner.os == 'Windows'
        uses: pnpm/action-setup@v6.1.0
      - if: runner.os == 'Windows'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          MVND_VERSION: 1.0.6
          MVND_SHA512: 4dd97b1f26525055cec960fb5b953b70d1e6606f96f5b096efa932754fd3e9d0238e00ca97779368f29cb751f1776445c45da618ea8d0d84692c3b936087309f
        run: |
          $name = "maven-mvnd-$env:MVND_VERSION-windows-amd64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/apache/maven-mvnd/releases/download/$env:MVND_VERSION/$name.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA512).Hash -ne $env:MVND_SHA512) { throw "$zip does not match its SHA-512" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "MVND_HOME_$($env:MVND_VERSION.Replace('.', '_'))=$(Join-Path $env:RUNNER_TEMP $name)" | Add-Content $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pnpm test:integration
        env:
          SPOTLESS_FOR_GRADLE_AND_MAVEN_TEST_PROFILE: ${{ matrix.profile }}
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-logs-${{ runner.os }}-${{ matrix.profile }}
          path: .cache/logs
          include-hidden-files: true

  tagpr:
    if: github.event_name == 'push'
    needs: [checks, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@v1.21.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    if: needs.tagpr.outputs.tag != ''
    needs: tagpr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: marketplace
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.tagpr.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
      - run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - run: gh release upload "$TAG" ./*.vsix --clobber
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: pnpm exec vsce publish --azure-credential --skip-duplicate --packagePath ./*.vsix
      - run: pnpm exec ovsx publish ./*.vsix --skip-duplicate --trusted-publishing
      - run: gh release edit "$TAG" --draft=false
