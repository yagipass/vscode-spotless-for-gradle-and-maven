apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: vscode-spotless-for-gradle-and-maven
  owner: yagipass
spec:
  description: A VS Code extension that formats files on save with the Spotless configuration of their Gradle or Maven build.
  visibility: public
  archived: false
  topics:
    - code-formatter
    - code-style
    - format-on-save
    - gradle
    - java
    - maven
    - spotless
    - vscode
    - vscode-extension
  labels:
    - name: accessibility
      description: Barrier affecting people with disabilities
      color: f143ab
    - name: bug
      description: Something isn't working
      color: d73a4a
    - name: dependencies
      description: Pull requests that update a dependency file
      color: 0366d6
    - name: documentation
      description: Improvements or additions to documentation
      color: 0075ca
    - name: duplicate
      description: This issue or pull request already exists
      color: cfd3d7
    - name: enhancement
      description: New feature or request
      color: a2eeef
    - name: github_actions
      description: Pull requests that update GitHub Actions code
      color: "000000"
    - name: good first issue
      description: Good for newcomers
      color: 7057ff
    - name: help wanted
      description: Extra attention is needed
      color: 008672
    - name: invalid
      description: This doesn't seem right
      color: e4e669
    - name: java
      description: Pull requests that update java code
      color: ffa221
    - name: javascript
      description: Pull requests that update javascript code
      color: "168700"
    - name: nix
      description: Pull requests that update nix code
      color: 3E6399
    - name: question
      description: Further information is requested
      color: d876e3
    - name: tagpr
      color: ededed
    - name: tagpr:major
      color: 99733A
    - name: wontfix
      description: This will not be worked on
      color: ffffff
  features:
    issues: true
    projects: false
    wiki: false
    discussions: false
    pull_requests: true
  merge_strategy:
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    allow_auto_merge: true
    auto_delete_head_branches: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
  release_immutability: true
  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: true
  rulesets:
    - name: protect-main
      target: branch
      enforcement: active
      bypass_actors:
        - role: admin
          bypass_mode: pull_request
      conditions:
        ref_name:
          include:
            - ~DEFAULT_BRANCH
      rules:
        pull_request:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false
        required_status_checks:
          strict_required_status_checks_policy: false
          contexts:
            - context: integration (macos-latest)
              app: github-actions
            - context: integration (ubuntu-latest)
              app: github-actions
            - context: integration (windows-latest)
              app: github-actions
            - context: checks
              app: github-actions
            - context: integration (ubuntu-latest, oldest)
              app: github-actions
        non_fast_forward: true
        update: false
        deletion: true
        creation: false
        required_linear_history: false
        required_signatures: false
    - name: protect-release-tags
      target: tag
      enforcement: active
      conditions:
        ref_name:
          include:
            - refs/tags/v*
      rules:
        non_fast_forward: false
        update: true
        deletion: true
        creation: false
        required_linear_history: false
        required_signatures: false
  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    workflow_permissions: read
    can_approve_pull_requests: true
    fork_pr_approval: first_time_contributors
